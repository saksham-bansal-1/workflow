name: Daily Commit Automation

on:
  schedule:
    # This means: run every day at 7:00 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # lets you run manually from Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update daily log by 23f2005020@ds.study.iitm.ac.in
        run: |
          echo "Last update: $(date -u)" > daily_update.log
          git config user.name "GitHub Action Bot"
          git config user.email "23f2005020@ds.study.iitm.ac.in"
          git add daily_update.log
          git commit -m "Automated daily update: $(date -u)" || echo "No changes to commit"
          git push
